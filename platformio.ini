; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = arduino_nano_esp32

[env:arduino_nano_esp32]
platform = espressif32
board = arduino_nano_esp32
framework = arduino
lib_deps = 
	https://github.com/sparkfun/SparkFun_BNO080_Arduino_Library.git
	https://github.com/handmade0octopus/ESP32-TWAI-CAN.git
monitor_speed = 115200
upload_protocol = dfu
build_flags = 
    -DBOARD_USES_HW_GPIO_NUMBERS
	-DARDUINO_USB_CDC_ON_BOOT 
platform_packages =
    tool-esptoolpy@~1.40501.0

[env:native]
platform = native
test_framework = unity
test_build_src = false
lib_deps =
    https://github.com/FabioBatSilva/ArduinoFake.git
build_flags =
	-DUNIT_TEST
	-I test/stubs

