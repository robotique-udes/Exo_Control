;adafruit_feather_esp32s3_nopsram

[env:adafruit_feather_esp32s3_nopsram]
platform = espressif32
board = arduino_nano_esp32
framework = arduino
monitor_speed = 115200
lib_deps = 
    bblanchon/ArduinoJson@^7.2.1
    ../libs
build_flags = -I../libs
platform_packages =
    tool-esptoolpy@~1.40501.0
